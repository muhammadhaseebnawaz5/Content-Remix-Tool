[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bulk-remix-studio"
version = "1.0.0"
description = "Professional desktop app for bulk video remixing with duplicate prevention"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Bulk Remix Studio", email = "dev@aibrs.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ai = [
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "openai-whisper>=20231117",
]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
ai-bulk-remix = "main:main"

[project.urls]
Homepage = "https://github.com/aibrs/ai-bulk-remix-studio"
Issues = "https://github.com/aibrs/ai-bulk-remix-studio/issues"

[tool.pyright]
# main.py adds the project root to sys.path at runtime, so imports like
# "src.ui.main_window" resolve from here — tell the IDE the same thing.
pythonVersion = "3.10"
pythonPlatform = "Windows"
extraPaths = ["."]
include = ["src", "main.py"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
